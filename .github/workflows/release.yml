name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew -x test jar

      - name: Run DecompileStress through Cardinal
        run: |
          javac --release 21 -d /tmp/stress-out examples/DecompileStress.java
          java -jar build/libs/cardinal-*.jar /tmp/stress-out/DecompileStress.class > /tmp/decompiled.txt
          test -s /tmp/decompiled.txt

      - name: Create GitHub Release and attach JAR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" build/libs/cardinal-*.jar --generate-notes